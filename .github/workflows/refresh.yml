# Every hour: collect Hadala's prices, value every item, post to Discord, and publish the dashboard
# and the slash-command function to Vercel.
#
# Started at :07 each hour by Supabase's scheduler (supabase/setup.sql), since GitHub's own schedule
# below only manages about three runs a day; it stays as a fallback.
#
# The database (aion2.db) is carried from run to run in the Actions cache, and backed up daily to the
# "db-backup" release (aion2.db.gz), restored from there if the cache is lost. It keeps Hadala hourly
# for 30 days and the other servers hourly for 8 days, then daily (db.prune).
#
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID; DISCORD_TOKEN, DISCORD_CHANNEL_ID,
# DISCORD_GUILD_ID (to post ideas, alerts and the weekly scorecard); SUPABASE_URL,
# SUPABASE_SERVICE_KEY (the price alerts). Without the Discord or Supabase ones, nothing is posted.
name: refresh

on:
  schedule:
    - cron: "7 * * * *"  # hourly, a few minutes past the hour (the site updates on the hour)
  workflow_dispatch:      # and by hand, from the Actions tab

concurrency:
  group: refresh          # one run at a time: two would each save their own copy of the database
  cancel-in-progress: false

permissions:
  contents: write         # to upload the database backup to the release

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"  # log lines as they happen, so a slow step shows where it is
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Restore the database
        id: db
        uses: actions/cache/restore@v4
        with:
          path: aion2.db
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Or restore it from the backup
        if: steps.db.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download db-backup --pattern aion2.db.gz
          gunzip aion2.db.gz

      - name: Restore the last good comparison
        # reports/ isn't in git: without this, a failed compare leaves the site with no compare.json (404)
        uses: actions/cache/restore@v4
        with:
          path: reports/compare.json
          key: compare-${{ github.run_id }}
          restore-keys: compare-

      - name: Collect and value
        # the site has outages: if collecting fails, value, post and publish from the stored data anyway
        run: |
          python -m aion2 run --config config.cloud.toml || echo "::warning::collect failed (the site may be down): using stored data"
          python -m aion2 compare --config config.cloud.toml || echo "::warning::compare failed (the site may be down): keeping the last compare.json"

      - name: Save the comparison
        # only if one exists: a fresh run replaces it, a failed run re-saves the restored one
        if: always() && hashFiles('reports/compare.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/compare.json
          key: compare-${{ github.run_id }}

      - name: Post to Discord and write the bot's data
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m aion2 publish --config config.cloud.toml

      - name: Save the database
        if: always() && hashFiles('aion2.db') != ''
        uses: actions/cache/save@v4
        with:
          path: aion2.db
          key: db-${{ github.run_id }}

      - name: Back up the database (daily)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gzip -kf aion2.db
            gh release upload db-backup aion2.db.gz --clobber
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59 deploy dist --prod --yes --token "$VERCEL_TOKEN"
